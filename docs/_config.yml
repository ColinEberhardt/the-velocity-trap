title: "The Velocity Trap"
subtitle: "a novella"
description: >-
  A business fable for the AI age, in the tradition of The Phoenix Project —
  an investigator is called in after a routine piece of software quietly
  fails, and finds a lot more waiting underneath it.

# Front-page blurb (Markdown, may run to several paragraphs). The shorter
# `description` above is still used for search and social-card metadata.
blurb: |
  A business fable for the AI age, in the tradition of *The Phoenix Project*.

  A critical blood result goes nowhere, and a doctor's pager stays silent all night. A junior engineer read every line of the change, and still didn't know what he'd deleted. A senior engineer wrote the warning down eleven months earlier, and was moved off the team for it. An entire engineering floor ships faster than ever, and quietly suspects it no longer understands its own systems.

  And in an eight-seat restaurant in Clerkenwell, a chef who once ran four kitchens already knows why.

# ~49,000 words of prose (manuscript-v2) at 250 words/minute. Update by hand if the
# manuscript's length changes materially — not computed automatically.
reading_time: "About 3 hours 15 minutes to read"

# We ship fully custom layouts/CSS — explicitly disable the default theme
# GitHub Pages otherwise assumes (jekyll-theme-primer) so it doesn't add
# unused assets to the build.
theme: null

# Base URL for GitHub Pages project sites, e.g. "/phoenix-project".
# Leave empty ("") if this is served from a user/org root site (username.github.io).
baseurl: "/the-velocity-trap"
url: "https://colineberhardt.github.io"

collections:
  chapters:
    output: true
    permalink: /chapters/:path/

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapter

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
